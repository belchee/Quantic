# Supabase CLI config (local dev + function settings).
project_id = "studio-beauty"

[auth]
site_url = "studiobeauty://"
# Phone + password login is implemented with a derived e-mail identifier
# (<digits>@phone.studiobeauty.app), so no SMS provider is needed.
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false   # REQUIRED: the derived address cannot receive mail
secure_password_change = false

[auth.external.apple]
enabled = true
client_id = "env(APPLE_BUNDLE_ID)"
secret = ""

[functions.delete-account]
verify_jwt = true

[functions.change-phone]
verify_jwt = true

[functions.dispatch-notifications]
verify_jwt = false   # called by pg_cron with the CRON_SECRET header
