name: Studio Beauty

on:
  push:
    paths: ['studio-beauty/**', '.github/workflows/studio-beauty.yml']
  pull_request:
    paths: ['studio-beauty/**', '.github/workflows/studio-beauty.yml']

jobs:
  database:
    name: Database (migrations + booking/capacity tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: studio-beauty
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/studio_beauty_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-beauty/package-lock.json
      - run: npm ci
      - run: npm test

  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-beauty/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock */index.ts

  mobile:
    name: Mobile (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-beauty/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-beauty/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
